# Copy to companies.yaml (`jobwatch init`) and edit.
# Sierra and Harvey stay on their Ashby boards. The next block is a verified
# set of Greenhouse, Lever, Ashby, Workday, and SmartRecruiters boards.
# Every company after that block is from the YC US hiring directory:
# https://www.ycombinator.com/companies?isHiring=true&regions=United%20States%20of%20America
# Those entries use scope: all and max_age_days: 90. Recent software
# engineering roles are kept, including ones that do not say new grad.
# Sales, marketing, and recruiting titles are dropped. GTM, solutions,
# support, and forward-deployed engineers are kept. Postings older than
# about three months are dropped. Phrase lists default in code; replace
# one with role_title_keep, role_title_drop, role_title_software, or
# role_body_software. `jobwatch sync-yc` refreshes that block.

defaults:
  include_title:
  - new grad
  - new graduate
  - new-grad
  - university grad
  - university graduate
  - college grad
  - recent grad
  - recent graduate
  - entry level
  - entry-level
  - early career
  - early-career
  - junior
  - intern
  - internship
  - campus
  - graduate program
  - graduate programme
  - '2027'
  exclude_title:
  - senior
  - staff
  - principal
  - director
  - head of
  - architect
  - distinguished
  - vp
  - manager
  - lead
  include_description:
  - new grad
  - new graduate
  - new-grad
  - university grad
  - university graduate
  - college grad
  - college graduate
  - recent grad
  - recent graduate
  - entry level
  - entry-level
  - early career
  - early-career
  - junior
  - intern
  - internship
  - graduate program
  - graduate programme
  check_description: true
  description_exclude: []
  preferred_grad_year: 2027
  max_enrich: 80
  locations:
    mode: include
    countries:
    - US
  rate_limit_rps: 1.5
  timeout_s: 25.0
  max_pages: null
companies:
