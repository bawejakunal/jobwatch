# Copy to companies.yaml (`jobwatch init`) and edit.
# `jobwatch add <url>` fills ats + identity. Marketing careers pages are fine
# when the ATS is embedded (Sierra) or when the domain slug matches a hosted
# board (Harvey → jobs.ashbyhq.com/harvey).
#
# Per-ATS samples (Greenhouse, Lever, Workday, SmartRecruiters, iCIMS) live in
# companies.ats-examples.yaml — useful for adapter tests, not the default whitelist.

defaults:
  include_title:
    - new grad
    - new graduate
    - new-grad
    - university grad
    - university graduate
    - college grad
    - recent grad
    - recent graduate
    - entry level
    - entry-level
    - early career
    - early-career
    - junior
    - intern
    - internship
    - campus
    - graduate program
    - graduate programme
    - "2027"
  exclude_title:
    - senior
    - staff
    - principal
    - director
    - head of
    - architect
    - distinguished
    - vp
    - manager
    - lead
  check_description: true
  preferred_grad_year: 2027
  max_enrich: 80
  rate_limit_rps: 1.5
  timeout_s: 25

companies:
  - id: sierra
    name: Sierra
    careers_url: https://sierra.ai/careers
    ats: ashby
    board: Sierra

  - id: harvey
    name: Harvey
    careers_url: https://www.harvey.ai/careers
    ats: ashby
    board: harvey
