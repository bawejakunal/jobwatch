# Copy to companies.yaml (jobwatch init) and edit.
# Hosted ATS URLs are enough — jobwatch add <url> fills ats + identity.

defaults:
  include_title:
    - new grad
    - new graduate
    - new-grad
    - university grad
    - university graduate
    - college grad
    - recent grad
    - recent graduate
    - entry level
    - entry-level
    - early career
    - early-career
    - junior
    - intern
    - internship
    - campus
    - graduate program
    - graduate programme
    - university
    - "2026"
    - "2027"
  exclude_title:
    - senior
    - staff
    - principal
    - director
    - head of
    - architect
    - distinguished
    - vp
    - manager
    - lead
  check_description: false
  rate_limit_rps: 1.5
  timeout_s: 25

companies:
  - id: discord
    name: Discord
    careers_url: https://job-boards.greenhouse.io/discord
    ats: greenhouse
    board: discord

  - id: palantir
    name: Palantir
    careers_url: https://jobs.lever.co/palantir
    ats: lever
    board: palantir

  - id: ashby
    name: Ashby
    careers_url: https://jobs.ashbyhq.com/ashby
    ats: ashby
    board: ashby

  - id: nvidia
    name: NVIDIA
    careers_url: https://nvidia.wd5.myworkdayjobs.com/en-US/NVIDIAExternalCareerSite
    ats: workday
    host: nvidia.wd5.myworkdayjobs.com
    tenant: nvidia
    site: NVIDIAExternalCareerSite
    locale: en-US
    # Cap paging for a first run. Drop this key to read up to the 2,000-row wrap.
    max_pages: 3

  - id: smartrecruiters
    name: SmartRecruiters
    careers_url: https://jobs.smartrecruiters.com/smartrecruiters
    ats: smartrecruiters
    board: smartrecruiters

  - id: fred-hutch
    name: Fred Hutch
    careers_url: https://careers-fhcrc.icims.com/jobs/search?ss=1
    ats: icims
    portal: https://careers-fhcrc.icims.com
