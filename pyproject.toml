[project]
name = "jobwatch"
version = "0.1.0"
description = "Watch a whitelist of company careers pages for new-grad and entry-level roles."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jobwatch" }]
keywords = ["jobs", "new-grad", "ats", "cli", "careers"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Utilities",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "httpx>=0.27",
  "lxml>=5.0",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
browser = ["playwright>=1.48"]
dev = ["pytest>=8.0", "respx>=0.22"]

[project.scripts]
jobwatch = "jobwatch.cli:app"

[project.urls]
Homepage = "https://github.com/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/PLAN.md",
  "/README.md",
  "/companies.example.yaml",
  "/.env.example",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
